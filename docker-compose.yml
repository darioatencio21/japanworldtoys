services:
  db:
    image: postgres:16-alpine
    container_name: jw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: japanworld
      POSTGRES_USER: jw_user
      POSTGRES_PASSWORD: jw_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jw_user -d japanworld"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
